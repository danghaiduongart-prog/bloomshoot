<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOOM SHOOT - Ghép Khung Ảnh Tự Do</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b020a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        header { width: 100%; max-width: 1200px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a0826; }
        .brand { font-size: 20px; font-weight: bold; color: #fbe395; letter-spacing: 2px; }
        .brand span { display: block; font-size: 10px; color: #b3a5b3; letter-spacing: 1px; margin-top: 2px; }
        
        .main-container { width: 100%; max-width: 1200px; padding: 20px; display: grid; grid-template-columns: 1fr 450px; gap: 20px; margin-top: 10px; }
        @media(max-width: 900px) { .main-container { grid-template-columns: 1fr; } }

        .section-box { background: #1a0518; padding: 20px; border-radius: 16px; border: 1px solid #2a0826; }
        
        /* Khu vực tải ảnh lên & Grid */
        .upload-zone { border: 2px dashed #d4af37; padding: 25px; text-align: center; border-radius: 12px; background: #0b020a; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
        .upload-zone:hover { background: #2a0826; }
        
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; max-height: 45vh; overflow-y: auto; padding-right: 5px; margin-top: 10px; }
        .photo-item { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; aspect-ratio: 3/4; background: #0b020a; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .photo-item:hover { border-color: #d4af37; }

        .action-bar { display: flex; gap: 10px; margin-top: 15px; }
        .btn-sub { flex: 1; background: #0b020a; border: 1px solid #d4af37; color: #fbe395; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-sub:hover { background: #2a0826; }

        /* Khung & Canvas A4 */
        .frame-section { display: flex; flex-direction: column; align-items: center; }
        .frame-select-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-bottom: 15px; }
        .btn-frame { background: #0b020a; border: 1px solid #2a0826; color: #b3a5b3; padding: 10px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: bold; text-align: center; }
        .btn-frame.active { border-color: #d4af37; color: #fbe395; background: #2a0826; }

        canvas { width: 100%; max-height: 500px; object-fit: contain; border-radius: 8px; background: #0b020a; border: 1px solid #2a0826; margin-bottom: 15px; }
        
        .btn-main { width: 100%; background: linear-gradient(135deg, #d4af37, #fbe395); color: #0b020a; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .btn-main:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            BLOOM SHOOT
            <span>VŨNG TÀU PHOTOBOTH</span>
        </div>
    </header>

    <div class="main-container">
        <!-- Trái: Tải ảnh và chọn ảnh -->
        <div class="section-box">
            <h3 style="color: #fbe395; font-size: 16px; margin-bottom: 12px;">📁 TẢI ẢNH CỦA BẠN</h3>
            
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <p style="color: #fbe395; font-weight: bold; font-size: 14px;">+ Bấm vào đây để chọn ảnh từ điện thoại</p>
                <p style="color: #b3a5b3; font-size: 12px; margin-top: 5px;">(Chọn nhiều ảnh gốc đã tải về máy)</p>
                <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" onchange="handleFiles(this)">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                <h3 style="color: #fbe395; font-size: 14px;">KHO ẢNH ĐÃ CHỌN (<span id="photoCount">0</span>)</h3>
            </div>
            
            <div class="photo-grid" id="photoGrid"></div>
            
            <div class="action-bar">
                <button class="btn-sub" onclick="autoFillFrames()">⚡ Tự động điền khung</button>
                <button class="btn-sub" onclick="clearPhotos()" style="border-color: #ff6b81; color: #ff6b81;">🗑️ Xóa tất cả</button>
            </div>
        </div>

        <!-- Phải: Chọn Khung & Xuất File -->
        <div class="section-box frame-section">
            <h3 style="color: #fbe395; font-size: 16px; margin-bottom: 12px;">🎨 CHỌN KHUNG GHÉP (A4)</h3>
            
            <div class="frame-select-group">
                <button class="btn-frame active" onclick="setFrameType('basic_4', event)">Basic 4 Ảnh</button>
                <button class="btn-frame" onclick="setFrameType('flower_4', event)">Hoa Hòe 4 Ảnh</button>
                <button class="btn-frame" onclick="setFrameType('basic_9', event)">Grid 9 Ảnh</button>
            </div>

            <canvas id="a4Canvas" width="2480" height="3508"></canvas>

            <button class="btn-main" onclick="downloadA4()">📥 TẢI FILE KHUNG A4 VỀ MÁY</button>
        </div>
    </div>

<script>
    let availablePhotos = [];
    let assignedPhotos = {}; 
    let currentFrame = "basic_4"; 

    function handleFiles(input) {
        if (!input.files) return;
        for (let file of input.files) {
            let reader = new FileReader();
            reader.onload = function(e) {
                availablePhotos.push(e.target.result);
                renderPhotoGrid();
                renderA4Canvas();
            }
            reader.readAsDataURL(file);
        }
        document.getElementById('photoCount').innerText = availablePhotos.length;
    }

    function clearPhotos() {
        availablePhotos = [];
        assignedPhotos = {};
        document.getElementById('photoGrid').innerHTML = '';
        document.getElementById('photoCount').innerText = 0;
        renderA4Canvas();
    }

    function renderPhotoGrid() {
        let grid = document.getElementById('photoGrid');
        grid.innerHTML = '';
        document.getElementById('photoCount').innerText = availablePhotos.length;
        availablePhotos.forEach((url, idx) => {
            let item = document.createElement('div');
            item.className = 'photo-item';
            item.innerHTML = `<img src="${url}"><div style="position:absolute; bottom:2px; left:2px; background:rgba(0,0,0,0.7); font-size:10px; padding:2px 5px; border-radius:4px;">#${idx+1}</div>`;
            item.onclick = () => assignToNextSlot(url);
            grid.appendChild(item);
        });
    }

    function setFrameType(type, event) {
        currentFrame = type;
        document.querySelectorAll('.btn-frame').forEach(b => b.classList.remove('active'));
        if(event && event.target) event.target.classList.add('active');
        assignedPhotos = {};
        renderA4Canvas();
    }

    function autoFillFrames() {
        let maxSlots = (currentFrame === 'basic_9') ? 9 : 4;
        availablePhotos.forEach((url, i) => {
            if (i < maxSlots) assignedPhotos[i] = url;
        });
        renderA4Canvas();
    }

    function assignToNextSlot(url) {
        let maxSlots = (currentFrame === 'basic_9') ? 9 : 4;
        for (let i = 0; i < maxSlots; i++) {
            if (!assignedPhotos[i]) {
                assignedPhotos[i] = url;
                break;
            }
        }
        renderA4Canvas();
    }

    async function renderA4Canvas() {
        let canvas = document.getElementById('a4Canvas');
        let ctx = canvas.getContext('2d');
        let width = 2480, height = 3508;

        ctx.fillStyle = (currentFrame === 'flower_4') ? '#2a0520' : '#140312';
        ctx.fillRect(0, 0, width, height);

        if (currentFrame === 'flower_4') {
            ctx.strokeStyle = '#fbe395';
            ctx.lineWidth = 15;
            ctx.strokeRect(80, 80, width - 160, height - 160);
            ctx.fillStyle = '#fbe395';
            ctx.font = 'bold 70px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🌸 BLOOM SHOOT STUDIO 🌸', width / 2, 220);
        } else {
            ctx.fillStyle = '#fbe395';
            ctx.font = 'bold 60px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('BLOOM SHOOT PHOTOBOOTH', width / 2, 180);
        }

        let slots = [];
        if (currentFrame === 'basic_9') {
            let startX = 200, startY = 350, sW = 650, sH = 900, gapX = 80, gapY = 80;
            for(let r=0; r<3; r++) {
                for(let c=0; c<3; c++) {
                    slots.push({x: startX + c*(sW+gapX), y: startY + r*(sH+gapY), w: sW, h: sH});
                }
            }
        } else {
            let startX = 300, startY = 300, sW = 1880, sH = 1300, gapY = 100;
            if (currentFrame === 'flower_4') { startY = 350; sH = 1250; }
            slots.push({x: startX, y: startY, w: sW, h: sH});
            slots.push({x: startX, y: startY + sH + gapY, w: sW, h: sH});
        }

        for (let i = 0; i < slots.length; i++) {
            let slot = slots[i];
            ctx.save();
            ctx.fillStyle = '#0b020a';
            ctx.fillRect(slot.x, slot.y, slot.w, slot.h);
            ctx.strokeStyle = '#3a0c35';
            ctx.lineWidth = 6;
            ctx.strokeRect(slot.x, slot.y, slot.w, slot.h);

            if (assignedPhotos[i]) {
                ctx.beginPath();
                ctx.rect(slot.x, slot.y, slot.w, slot.h);
                ctx.clip();

                let img = await loadImage(assignedPhotos[i]);
                if (img) {
                    let imgRatio = img.width / img.height;
                    let slotRatio = slot.w / slot.h;
                    let dW, dH, oX = 0, oY = 0;
                    if (imgRatio > slotRatio) {
                        dH = slot.h; dW = slot.h * imgRatio; oX = (dW - slot.w) / 2;
                    } else {
                        dW = slot.w; dH = slot.w / imgRatio; oY = (dH - slot.h) / 2;
                    }
                    ctx.drawImage(img, slot.x - oX, slot.y - oY, dW, dH);
                }
            } else {
                ctx.fillStyle = '#b3a5b3';
                ctx.font = '40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`+ Chọn ảnh ${i+1}`, slot.x + slot.w/2, slot.y + slot.h/2);
            }
            ctx.restore();
        }

        ctx.fillStyle = '#fbe395';
        ctx.font = 'bold 50px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`BLOOM SHOOT VŨNG TÀU - SELF SERVICE`, width / 2, height - 100);
    }

    function loadImage(src) {
        return new Promise(resolve => {
            let img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            img.src = src;
        });
    }

    function downloadA4() {
        let canvas = document.getElementById('a4Canvas');
        let link = document.createElement('a');
        link.download = `BLOOM_FRAME_A4.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // Khởi tạo khung trống ban đầu
    renderA4Canvas();
</script>
</body>
</html>
