<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLOOM SHOOT - Self Photobooth Studio</title>
  <style>
    :root {
      --bg-purple: #1a0518;
      --card-purple: #2a0826;
      --accent-yellow: #fbe395;
      --accent-gold: #d4af37;
      --text-white: #ffffff;
      --text-sub: #b3a5b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b020a;
      background-image: radial-gradient(circle at 50% 20%, #3a0d35 0%, #0b020a 70%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .app-viewport {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 850px;
      background-color: var(--bg-purple);
      border-radius: 28px;
      border: 1px solid rgba(251, 227, 149, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(251, 227, 149, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .header {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(26, 5, 24, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--accent-yellow);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(251, 227, 149, 0.3);
    }

    .brand-subtitle {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* Screen 1: Phone Login */
    .login-card {
      background: var(--card-purple);
      border-radius: 20px;
      padding: 24px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin: auto 0;
      text-align: center;
    }

    .input-label {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: block;
    }

    .phone-input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--accent-yellow);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 18px;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      margin-bottom: 16px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-gold) 100%);
      color: #1a0518;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(251, 227, 149, 0.2);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Screen 2: Photo Selection & Auto Fill */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .photo-item {
      aspect-ratio: 1;
      background: #333;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .photo-item.selected {
      border-color: var(--accent-yellow);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-check {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--accent-yellow);
      color: #000;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .photo-item.selected .badge-check {
      display: flex;
    }

    .autofill-banner {
      background: rgba(251, 227, 149, 0.1);
      border: 1px dashed var(--accent-yellow);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .autofill-btn {
      background: var(--accent-yellow);
      color: #1a0518;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 6px;
      cursor: pointer;
    }

    /* Screen 3: Frame Customization (Cá Space Style) */
    .tabs-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 16px;
      white-space: nowrap;
      font-size: 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent-yellow);
      color: #1a0518;
      font-weight: bold;
    }

    .preview-canvas-wrap {
      flex: 1;
      background: #000;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
      position: relative;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .tools-panel {
      background: var(--card-purple);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .slider {
      width: 60%;
      accent-color: var(--accent-yellow);
    }

    .filter-options {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .filter-btn {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 6px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .filter-btn.active {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--accent-yellow);
      background: transparent;
      color: var(--accent-yellow);
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    /* Order Processing Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 2, 10, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .overlay.active {
      display: flex;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(251, 227, 149, 0.2);
      border-top-color: var(--accent-yellow);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="header">
      <div class="brand-title">BLOOM SHOOT</div>
      <div class="brand-subtitle">SELF PHOTOBOOTH STUDIO</div>
    </div>

    <div class="content-area">
      <!-- SCREEN 1: LOGIN -->
      <div id="screen-1" class="screen active">
        <div class="login-card">
          <h3 style="margin-bottom: 8px; color: var(--accent-yellow);">NHẬP CA CHỤP</h3>
          <span class="input-label">Vui lòng nhập Số điện thoại đã đăng ký</span>
          <input type="tel" id="phone-input" class="phone-input" value="0901234567" placeholder="090 123 4567" />
          <button class="btn-primary" onclick="goToScreen(2)">TRUY CẬP KHO ẢNH</button>
        </div>
      </div>

      <!-- SCREEN 2: SELECT PHOTOS / AUTO FILL -->
      <div id="screen-2" class="screen">
        <div class="autofill-banner">
          <div style="font-size: 12px; color: var(--accent-yellow);">⚡ Tiết kiệm thời gian (Chuẩn Cá Space)</div>
          <button class="autofill-btn" onclick="autoFill27()">Auto Fill 27 Photos Vào Frame</button>
        </div>
        
        <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 8px;">Hoặc chọn thủ công 20 ảnh đẹp nhất:</div>
        
        <div class="photo-grid" id="photo-grid-container"></div>
        
        <button class="btn-primary" style="margin-top: auto;" onclick="goToScreen(3)">TIẾP TỤC: GHÉP FRAME</button>
      </div>

      <!-- SCREEN 3: FRAME & FILTER CUSTOMIZATION -->
      <div id="screen-3" class="screen">
        <div class="tabs-bar">
          <button class="tab-btn active" onclick="switchFrame('strip')">Frame 1 (Dải Strip)</button>
          <button class="tab-btn" onclick="switchFrame('grid')">Frame 2 (Lưới Grid)</button>
          <button class="tab-btn" onclick="switchFrame('poster')">Frame 3 (Poster 20)</button>
        </div>

        <div class="preview-canvas-wrap">
          <canvas id="photoCanvas" width="800" height="1200"></canvas>
        </div>

        <div class="tools-panel">
          <div class="control-row">
            <span>Zoom góc mặt:</span>
            <input type="range" class="slider" min="100" max="200" value="120" oninput="updateCanvasZoom(this.value)" />
          </div>
          <div class="control-row">
            <span>Bộ lọc màu:</span>
            <div class="filter-options">
              <button class="filter-btn active" onclick="applyFilter('original', this)">Original</button>
              <button class="filter-btn" onclick="applyFilter('bw', this)">B&W</button>
              <button class="filter-btn" onclick="applyFilter('vintage', this)">Vintage</button>
            </div>
          </div>
        </div>

        <div class="action-group">
          <button class="btn-secondary" onclick="savePhoto()">SAVE PHOTO</button>
          <button class="btn-primary" style="flex: 1.2;" onclick="orderPrint()">ORDER (IN ẢNH)</button>
        </div>
      </div>
    </div>

    <!-- ORDER PROCESSING OVERLAY -->
    <div id="order-overlay" class="overlay">
      <div id="overlay-spinner" class="spinner"></div>
      <h3 id="overlay-title" style="color: var(--accent-yellow); margin-bottom: 8px;">Preparing Order...</h3>
      <p id="overlay-msg" style="font-size: 13px; color: var(--text-sub);">Vui lòng giữ nguyên màn hình trong giây lát!</p>
      <button id="overlay-close-btn" class="btn-primary" style="margin-top: 20px; display: none;" onclick="resetApp()">TẠO ĐƠN HÀNG MỚI</button>
    </div>
  </div>

  <script>
    let selectedPhotos = [];
    let currentFrame = 'strip';
    let currentFilter = 'original';
    let zoomLevel = 1.2;
    const sampleImages = [];

    // Tạo ảnh mẫu Placeholder nghệ thuật
    for (let i = 1; i <= 27; i++) {
      sampleImages.push(`https://picsum.photos/seed/bloom_${i}/300/300`);
    }

    function initScreen2() {
      const container = document.getElementById('photo-grid-container');
      container.innerHTML = '';
      sampleImages.slice(0, 12).forEach((url, idx) => {
        const item = document.createElement('div');
        item.className = 'photo-item' + (idx < 4 ? ' selected' : '');
        item.onclick = () => {
          item.classList.toggle('selected');
        };
        item.innerHTML = `<img src="${url}" /><div class="badge-check">✓</div>`;
        container.appendChild(item);
      });
    }

    function autoFill27() {
      selectedPhotos = [...sampleImages];
      goToScreen(3);
    }

    function goToScreen(screenNum) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(`screen-${screenNum}`).classList.add('active');
      if (screenNum === 2) initScreen2();
      if (screenNum === 3) renderCanvas();
    }

    function switchFrame(frameType) {
      currentFrame = frameType;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderCanvas();
    }

    function updateCanvasZoom(val) {
      zoomLevel = val / 100;
      renderCanvas();
    }

    function applyFilter(filterName, btn) {
      currentFilter = filterName;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCanvas();
    }

    function renderCanvas() {
      const canvas = document.getElementById('photoCanvas');
      const ctx = canvas.getContext('2d');
      
      // Vẽ background khung tím nghệ thuật BLOOM SHOOT
      ctx.fillStyle = '#2a0826';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Vẽ Header Logo trong Frame
      ctx.fillStyle = '#fbe395';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BLOOM SHOOT', canvas.width / 2, 60);

      // Bố cục vẽ ảnh dựa trên mẫu Frame
      const cols = currentFrame === 'strip' ? 2 : (currentFrame === 'grid' ? 3 : 4);
      const rows = currentFrame === 'strip' ? 4 : (currentFrame === 'grid' ? 4 : 5);
      const margin = 20;
      const startY = 90;
      const cellW = (canvas.width - margin * (cols + 1)) / cols;
      const cellH = (canvas.height - startY - 80 - margin * (rows + 1)) / rows;

      let imgIdx = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = margin + c * (cellW + margin);
          const y = startY + r * (cellH + margin);

          ctx.fillStyle = '#1a0518';
          ctx.fillRect(x, y, cellW, cellH);

          // Vẽ hiệu ứng ô ảnh
          ctx.strokeStyle = '#fbe395';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, cellW, cellH);

          ctx.fillStyle = 'rgba(251, 227, 149, 0.4)';
          ctx.font = '14px sans-serif';
          ctx.fillText(`Photo #${imgIdx + 1}`, x + cellW/2, y + cellH/2);

          imgIdx++;
        }
      }

      // Footer Khung
      ctx.fillStyle = '#b3a5b3';
      ctx.font = '16px sans-serif';
      ctx.fillText('www.bloomshoot.vn • Self Photobooth', canvas.width / 2, canvas.height - 30);
    }

    function savePhoto() {
      const canvas = document.getElementById('photoCanvas');
      const link = document.createElement('a');
      link.download = `BLOOM_SHOOT_FRAME_${Date.now()}.png`;
      link.href = canvas.toDataURL();
      link.click();
    }

    function orderPrint() {
      const overlay = document.getElementById('order-overlay');
      const title = document.getElementById('overlay-title');
      const msg = document.getElementById('overlay-msg');
      const spinner = document.getElementById('overlay-spinner');
      const closeBtn = document.getElementById('overlay-close-btn');

      overlay.classList.add('active');
      spinner.style.display = 'block';
      closeBtn.style.display = 'none';
      title.innerText = 'Preparing & Uploading Prints...';
      msg.innerText = 'Đang truyền file về hệ thống máy in tại booth. Vui lòng giữ màn hình này!';

      // Giả lập quy trình gửi lệnh ngầm sang Backend Python
      setTimeout(() => {
        spinner.style.display = 'none';
        title.innerText = 'THANK YOU!';
        const orderId = 'BS-' + Math.floor(100000 + Math.random() * 900000);
        msg.innerHTML = `Lệnh in đã được xác nhận thành công!<br><strong style="color:var(--accent-yellow); font-size:16px;">Mã Đơn Hàng: ${orderId}</strong><br>Vui lòng đợi nhận ảnh tại quầy tiệm.`;
        closeBtn.style.display = 'block';
      }, 2500);
    }

    function resetApp() {
      document.getElementById('order-overlay').classList.remove('active');
      goToScreen(1);
    }
  </script>
</body>
</html>
