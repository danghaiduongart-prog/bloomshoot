<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOOM SHOOT - Self Photobooth Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b020a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        header { width: 100%; max-width: 1200px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a0826; }
        .brand { font-size: 20px; font-weight: bold; color: #fbe395; letter-spacing: 2px; }
        .brand span { display: block; font-size: 10px; color: #b3a5b3; letter-spacing: 1px; margin-top: 2px; }
        .nav-btns { display: flex; gap: 10px; }
        .btn-icon { background: #1a0518; border: 1px solid #2a0826; color: #fbe395; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13px; }
        .btn-icon:hover { background: #2a0826; }

        /* Màn hình Nhập Mã */
        .login-card { background: #1a0518; padding: 40px 30px; border-radius: 20px; border: 1px solid #2a0826; text-align: center; max-width: 380px; width: 90%; margin-top: 80px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card h1 { color: #fbe395; font-size: 22px; margin-bottom: 6px; }
        .login-card p { color: #b3a5b3; font-size: 13px; margin-bottom: 25px; }
        .code-input { width: 100%; padding: 14px; font-size: 28px; font-weight: bold; text-align: center; border-radius: 12px; border: 2px solid #2a0826; background: #0b020a; color: #fbe395; letter-spacing: 6px; margin-bottom: 15px; }
        .code-input:focus { outline: none; border-color: #d4af37; }
        .btn-main { width: 100%; background: linear-gradient(135deg, #d4af37, #fbe395); color: #0b020a; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; }
        .btn-main:hover { opacity: 0.9; }

        /* Studio Workspace */
        .studio-container { width: 100%; max-width: 1200px; padding: 20px; display: none; gap: 20px; margin-top: 10px; }
        .section-box { background: #1a0518; padding: 20px; border-radius: 16px; border: 1px solid #2a0826; }
        
        /* Grid Ảnh Gốc */
        .photos-section { flex: 1; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 5px; margin-top: 15px; }
        .photo-item { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; aspect-ratio: 3/4; background: #0b020a; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .action-bar { display: flex; gap: 10px; margin-top: 15px; }
        .btn-sub { flex: 1; background: #0b020a; border: 1px solid #d4af37; color: #fbe395; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-sub:hover { background: #2a0826; }

        /* Khu vực Chọn Khung & Canvas A4 */
        .frame-section { width: 450px; display: flex; flex-direction: column; align-items: center; }
        .frame-select-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-bottom: 15px; }
        .btn-frame { background: #0b020a; border: 1px solid #2a0826; color: #b3a5b3; padding: 10px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: bold; text-align: center; }
        .btn-frame.active { border-color: #d4af37; color: #fbe395; background: #2a0826; }

        canvas { width: 100%; max-height: 550px; object-fit: contain; border-radius: 8px; background: #0b020a; border: 1px solid #2a0826; margin-bottom: 15px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-body { background: #1a0518; border: 1px solid #2a0826; padding: 25px; border-radius: 16px; width: 90%; max-width: 450px; }
        .modal-body h3 { color: #fbe395; margin-bottom: 15px; }
        .modal-body input { width: 100%; padding: 12px; background: #0b020a; border: 1px solid #2a0826; color: white; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            BLOOM SHOOT
            <span>SELF PHOTOBOOTH STUDIO</span>
        </div>
        <div class="nav-btns">
            <button class="btn-icon" id="btnChangeCode" style="display: none;" onclick="resetToLogin()">⚙️ Đổi mã vé</button>
            <button class="btn-icon" onclick="openConfigModal()">🌐 Cấu hình Server</button>
        </div>
    </header>

    <!-- Màn hình 1: Nhập Mã -->
    <div class="login-card" id="loginCard">
        <h1>NHẬP MÃ VÉ</h1>
        <p>Nhập 6 số mã phiên chụp của bạn để nhận ảnh</p>
        <input type="text" id="ticketCodeInput" class="code-input" placeholder="------" maxlength="6" autocomplete="off">
        <button class="btn-main" onclick="startStudioSession()">XEM KHO ẢNH</button>
    </div>

    <!-- Màn hình 2: Studio Chính -->
    <div class="studio-container" id="studioContainer" style="display: none; display: grid; grid-template-columns: 1fr 460px;">
        
        <!-- Trái: Danh sách ảnh gốc & Tải xuống -->
        <div class="section-box photos-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: #fbe395; font-size: 16px;">📸 KHO ẢNH CHỤP GỐC</h3>
                <span id="txtSessionCode" style="color: #b3a5b3; font-size: 13px;">Mã vé: ------</span>
            </div>
            <div class="photo-grid" id="photoGrid"></div>
            
            <div class="action-bar">
                <button class="btn-sub" onclick="downloadAllPhotos()">📥 Tải tất cả ảnh gốc</button>
                <button class="btn-sub" onclick="autoFillFrames()">⚡ Tự động điền vào khung</button>
            </div>
        </div>

        <!-- Phải: Chọn Khung A4 & In ấn -->
        <div class="section-box frame-section">
            <h3 style="color: #fbe395; font-size: 16px; margin-bottom: 12px;">🎨 CHỌN KHUNG GHÉP (A4)</h3>
            
            <div class="frame-select-group">
                <button class="btn-frame active" onclick="setFrameType('basic_4')">Basic 4 Ảnh</button>
                <button class="btn-frame" onclick="setFrameType('flower_4')">Hoa Hòe 4 Ảnh</button>
                <button class="btn-frame" onclick="setFrameType('basic_9')">Grid 9 Ảnh</button>
            </div>

            <canvas id="a4Canvas" width="2480" height="3508"></canvas>

            <button class="btn-main" onclick="printOrDownloadA4()">🖨️ TẢI FILE KHUNG A4 ĐỂ IN</button>
        </div>
    </div>

    <!-- Modal Cấu Hình Server -->
    <div class="modal" id="configModal">
        <div class="modal-body">
            <h3>🌐 Cấu Hình Đường Dẫn Server Booth</h3>
            <p style="font-size: 12px; color: #b3a5b3; margin-bottom: 10px;">Nhập IP nội bộ máy tiệm (VD: http://192.168.0.71:5001):</p>
            <input type="text" id="serverUrlInput">
            <div style="display: flex; gap: 10px;">
                <button class="btn-sub" onclick="closeConfigModal()">Hủy</button>
                <button class="btn-main" onclick="saveServerConfig()">Lưu</button>
            </div>
        </div>
    </div>

<script>
    let DEFAULT_SERVER = "http://192.168.0.71:5001";
    let serverUrl = localStorage.getItem('bloom_server_url') || DEFAULT_SERVER;
    let activeCode = "";
    let availablePhotos = [];
    let assignedPhotos = {}; // Lưu vị trí ảnh vào khung
    let currentFrame = "basic_4"; // basic_4, flower_4, basic_9
    let pollInterval = null;

    document.getElementById('serverUrlInput').value = serverUrl;

    function openConfigModal() { document.getElementById('configModal').style.display = 'flex'; }
    function closeConfigModal() { document.getElementById('configModal').style.display = 'none'; }
    function saveServerConfig() {
        let val = document.getElementById('serverUrlInput').value.trim();
        if (val.endsWith('/')) val = val.slice(0, -1);
        serverUrl = val;
        localStorage.setItem('bloom_server_url', serverUrl);
        closeConfigModal();
        if(activeCode) fetchPhotos();
    }

    function startStudioSession() {
        let code = document.getElementById('ticketCodeInput').value.trim();
        if (!code) return alert("Vui lòng nhập mã vé!");
        activeCode = code;
        
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('studioContainer').style.display = 'grid';
        document.getElementById('btnChangeCode').style.display = 'block';
        document.getElementById('txtSessionCode').innerText = "Mã vé: " + activeCode;

        fetchPhotos();
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(fetchPhotos, 2000);
    }

    function resetToLogin() {
        if (pollInterval) clearInterval(pollInterval);
        activeCode = "";
        assignedPhotos = {};
        document.getElementById('loginCard').style.display = 'block';
        document.getElementById('studioContainer').style.display = 'none';
        document.getElementById('btnChangeCode').style.display = 'none';
    }

    async function fetchPhotos() {
        if (!activeCode) return;
        try {
            let res = await fetch(`${serverUrl}/api/images?code=${activeCode}`);
            if (res.ok) {
                let data = await res.json();
                availablePhotos = data.map(url => url.startsWith('http') ? url : `${serverUrl}${url}`);
                renderPhotoGrid();
                renderA4Canvas();
            }
        } catch (e) { console.log("Đang kết nối server..."); }
    }

    function renderPhotoGrid() {
        let grid = document.getElementById('photoGrid');
        grid.innerHTML = '';
        availablePhotos.forEach((url, idx) => {
            let item = document.createElement('div');
            item.className = 'photo-item';
            item.innerHTML = `<img src="${url}"><div style="position:absolute; bottom:2px; left:2px; background:rgba(0,0,0,0.7); font-size:10px; padding:2px 5px; border-radius:4px;">#${idx+1}</div>`;
            item.onclick = () => assignToNextSlot(url);
            grid.appendChild(item);
        });
    }

    function setFrameType(type) {
        currentFrame = type;
        document.querySelectorAll('.btn-frame').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        assignedPhotos = {};
        renderA4Canvas();
    }

    function autoFillFrames() {
        let maxSlots = (currentFrame === 'basic_9') ? 9 : 4;
        availablePhotos.forEach((url, i) => {
            if (i < maxSlots) assignedPhotos[i] = url;
        });
        renderA4Canvas();
    }

    function assignToNextSlot(url) {
        let maxSlots = (currentFrame === 'basic_9') ? 9 : 4;
        for (let i = 0; i < maxSlots; i++) {
            if (!assignedPhotos[i]) {
                assignedPhotos[i] = url;
                break;
            }
        }
        renderA4Canvas();
    }

    // Vẽ Khung A4 Chuẩn 300 DPI (2480 x 3508 px)
    async function renderA4Canvas() {
        let canvas = document.getElementById('a4Canvas');
        let ctx = canvas.getContext('2d');
        let width = 2480, height = 3508;

        // Background theo loại khung
        ctx.fillStyle = (currentFrame === 'flower_4') ? '#2a0520' : '#140312';
        ctx.fillRect(0, 0, width, height);

        // Vẽ hoạ tiết khung hoa hòe giả lập hoặc viền basic
        if (currentFrame === 'flower_4') {
            ctx.strokeStyle = '#fbe395';
            ctx.lineWidth = 15;
            ctx.strokeRect(80, 80, width - 160, height - 160);
            
            ctx.fillStyle = '#fbe395';
            ctx.font = 'bold 70px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🌸 BLOOM SHOOT STUDIO 🌸', width / 2, 220);
        } else {
            ctx.fillStyle = '#fbe395';
            ctx.font = 'bold 60px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('BLOOM SHOOT PHOTOBOOTH', width / 2, 180);
        }

        // Định nghĩa ô (Slots) cho từng loại khung A4
        let slots = [];
        if (currentFrame === 'basic_9') {
            let startX = 200, startY = 350, sW = 650, sH = 900, gapX = 80, gapY = 80;
            for(let r=0; r<3; r++) {
                for(let c=0; c<3; c++) {
                    slots.push({x: startX + c*(sW+gapX), y: startY + r*(sH+gapY), w: sW, h: sH});
                }
            }
        } else {
            // Khung 4 ảnh dọc/ngang full A4
            let startX = 300, startY = 300, sW = 1880, sH = 1300, gapY = 100;
            if (currentFrame === 'flower_4') { startY = 350; sH = 1250; }
            slots.push({x: startX, y: startY, w: sW, h: sH});
            slots.push({x: startX, y: startY + sH + gapY, w: sW, h: sH});
        }

        // Vẽ ảnh vào từng slot
        for (let i = 0; i < slots.length; i++) {
            let slot = slots[i];
            ctx.save();
            ctx.fillStyle = '#0b020a';
            ctx.fillRect(slot.x, slot.y, slot.w, slot.h);
            ctx.strokeStyle = '#3a0c35';
            ctx.lineWidth = 6;
            ctx.strokeRect(slot.x, slot.y, slot.w, slot.h);

            if (assignedPhotos[i]) {
                ctx.beginPath();
                ctx.rect(slot.x, slot.y, slot.w, slot.h);
                ctx.clip();

                let img = await loadImage(assignedPhotos[i]);
                if (img) {
                    ctx.translate(slot.x + slot.w, slot.y);
                    ctx.scale(-1, 1); // Lật gương chống ngược
                    let imgRatio = img.width / img.height;
                    let slotRatio = slot.w / slot.h;
                    let dW, dH, oX = 0, oY = 0;
                    if (imgRatio > slotRatio) {
                        dH = slot.h; dW = slot.h * imgRatio; oX = (dW - slot.w) / 2;
                    } else {
                        dW = slot.w; dH = slot.w / imgRatio; oY = (dH - slot.h) / 2;
                    }
                    ctx.drawImage(img, -oX, -oY, dW, dH);
                }
            } else {
                ctx.fillStyle = '#b3a5b3';
                ctx.font = '40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`+ Chọn ảnh ô ${i+1}`, slot.x + slot.w/2, slot.y + slot.h/2);
            }
            ctx.restore();
        }

        // Footer Mã vé
        ctx.fillStyle = '#fbe395';
        ctx.font = 'bold 50px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`MÃ VÉ: #${activeCode} - BLOOM SHOOT VŨNG TÀU`, width / 2, height - 100);
    }

    function loadImage(src) {
        return new Promise(resolve => {
            let img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            img.src = src;
        });
    }

    function downloadAllPhotos() {
        availablePhotos.forEach((url, i) => {
            let a = document.createElement('a');
            a.href = url;
            a.download = `BLOOM_${activeCode}_${i+1}.jpg`;
            a.target = '_blank';
            a.click();
        });
    }

    function printOrDownloadA4() {
        let canvas = document.getElementById('a4Canvas');
        let link = document.createElement('a');
        link.download = `BLOOM_FRAME_A4_${activeCode}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>
</body>
</html>
